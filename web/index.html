<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
    <title>Kiro-Go</title>
    <script>
      // Resolve the theme before first paint so a reload never flashes the wrong
      // background. Mirrors lib/theme.js — keep the storage key in sync.
      ;(function () {
        try {
          var pref = localStorage.getItem('kiro_theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
        } catch (e) {
          /* private mode: fall through to the dark default on <html> */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
